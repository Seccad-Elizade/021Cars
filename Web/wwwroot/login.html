<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Giriş — Avtomobil Parkı</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; height: 100%;
            font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
            background: #0f172a;
        }
        body {
            display: grid; place-items: center;
            background:
                radial-gradient(900px 500px at 15% -10%, rgba(37, 99, 235, .35), transparent 60%),
                radial-gradient(800px 500px at 110% 110%, rgba(8, 145, 178, .30), transparent 55%),
                linear-gradient(160deg, #0b1220 0%, #0f172a 45%, #131c31 100%);
            padding: 24px;
        }
        .card {
            width: 100%; max-width: 400px;
            background: rgba(23, 33, 52, .82);
            border: 1px solid rgba(148, 163, 184, .18);
            border-radius: 18px;
            padding: 34px 30px 28px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .55);
            backdrop-filter: blur(14px);
            color: #e2e8f0;
        }
        .logo {
            width: 60px; height: 60px; border-radius: 16px; margin: 0 auto 18px;
            background: linear-gradient(135deg, #2563eb, #0891b2);
            display: grid; place-items: center; font-size: 30px;
            box-shadow: 0 12px 30px rgba(37, 99, 235, .5);
        }
        h1 { font-size: 21px; margin: 0 0 4px; text-align: center; color: #fff; font-weight: 800; }
        .sub { text-align: center; color: #64748b; font-size: 12.5px; margin-bottom: 24px; letter-spacing: .04em; }
        label {
            display: block; font-size: 11px; font-weight: 700; letter-spacing: .09em;
            text-transform: uppercase; color: #94a3b8; margin-bottom: 7px;
        }
        input[type=password] {
            width: 100%; padding: 12px 14px; font-size: 15px;
            border-radius: 10px; border: 1px solid rgba(148, 163, 184, .28);
            background: rgba(15, 23, 42, .85); color: #fff;
            font-family: inherit; transition: border-color .15s, box-shadow .15s;
        }
        input[type=password]:focus {
            outline: none; border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, .22);
        }
        button {
            width: 100%; margin-top: 18px; padding: 12px;
            border: none; border-radius: 10px; cursor: pointer;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff; font-size: 14.5px; font-weight: 700; font-family: inherit;
            transition: filter .15s, transform .08s;
            box-shadow: 0 8px 22px rgba(37, 99, 235, .4);
        }
        button:hover { filter: brightness(1.1); }
        button:active { transform: translateY(1px); }
        .error {
            background: rgba(220, 38, 38, .16); border: 1px solid rgba(248, 113, 113, .4);
            color: #fca5a5; padding: 10px 13px; border-radius: 9px;
            font-size: 13px; margin-bottom: 18px; text-align: center; font-weight: 600;
        }
        .foot {
            text-align: center; margin-top: 22px; padding-top: 18px;
            border-top: 1px solid rgba(148, 163, 184, .13);
            font-size: 11.5px; color: #475569;
        }
        .foot b { color: #64748b; }

        /* ---- Eyni WiFi-dəkilər üçün qoşulma kartı ---- */
        .wifi {
            margin-top: 20px; padding-top: 18px;
            border-top: 1px solid rgba(148, 163, 184, .13);
            text-align: center;
        }
        .wifi-head {
            font-size: 11px; font-weight: 700; letter-spacing: .09em;
            text-transform: uppercase; color: #64748b; margin-bottom: 13px;
        }
        .wifi-qr {
            display: inline-block; padding: 9px; background: #fff;
            border-radius: 11px; line-height: 0;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
        }
        .wifi-qr img, .wifi-qr canvas { display: block; }
        .wifi-url {
            margin-top: 11px; font-size: 13.5px; font-weight: 700;
            color: #60a5fa; font-variant-numeric: tabular-nums;
            word-break: break-all;
        }
        .wifi-hint { margin-top: 5px; font-size: 11px; color: #475569; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🚘</div>
        <h1>Avtomobil Parkı</h1>
        <div class="sub">v6.0 &nbsp;•&nbsp; İDARƏETMƏ SİSTEMİ</div>

        <div class="error" id="err" style="display:none">
            ⚠ Şifrə yanlışdır. Yenidən cəhd edin.
        </div>

        <form method="post" action="/login" autocomplete="off">
            <label for="password">Giriş şifrəsi</label>
            <input type="password" id="password" name="password"
                   placeholder="••••••••" autofocus required />
            <input type="hidden" name="returnUrl" id="returnUrl" value="/" />
            <button type="submit">Daxil ol →</button>
        </form>

        <div class="foot">
            <b>021cars.az</b> &nbsp;•&nbsp; © <span id="year"></span>
        </div>

        <!-- Eyni WiFi-dəki cihazlar üçün (server tərəfindən doldurulur) -->
        <div class="wifi" id="wifi" style="display:none">
            <div class="wifi-head">📱 Eyni WiFi-dəkilər üçün</div>
            <div class="wifi-qr"><div id="qrcode"></div></div>
            <div class="wifi-url" id="wifiurl"></div>
            <div class="wifi-hint">Telefonun kamerasını QR koda tutun</div>
        </div>
    </div>

    <script src="/qrcode.min.js"></script>
    <script>
        (function () {
            var p = new URLSearchParams(location.search);
            if (p.get('e') === '1') {
                document.getElementById('err').style.display = 'block';
            }

            var r = p.get('r');
            if (r && r.charAt(0) === '/' && r.charAt(1) !== '/') {
                document.getElementById('returnUrl').value = r;
            }

            document.getElementById('year').textContent = new Date().getFullYear();

            // ---- Eyni WiFi-dəkilər üçün QR kod (server tərəfindən doldurulur) ----
            var lanUrl = "{{LAN_URL}}";

            if (lanUrl && lanUrl.length > 10 && typeof QRCode !== 'undefined') {
                document.getElementById('wifi').style.display = 'block';
                document.getElementById('wifiurl').textContent = lanUrl;

                try {
                    new QRCode(document.getElementById('qrcode'), {
                        text: lanUrl,
                        width: 140,
                        height: 140,
                        colorDark: '#0f172a',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } catch (e) {
                    document.getElementById('qrcode').style.display = 'none';
                }
            }
        })();
    </script>
</body>
</html>
